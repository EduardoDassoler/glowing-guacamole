<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .cadastro-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 320px;
        }
        h2 {
            margin-bottom: 20px;
            color: #333333;
            text-align: center;
        }
        label {
            font-weight: bold;
            color: #555555;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 6px 0 16px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background-color: #28a745; /* Cor verde para cadastro */
            color: white;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        button:hover {
            background-color: #218838;
        }
        .link-login {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }
        .link-login a {
            color: #007bff;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="cadastro-container">
        <h2>Criar Nova Conta</h2>
        <form>
            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" placeholder="Digite seu nome" required>

            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="seu-email@dominio.com" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Crie uma senha forte" required>

            <label for="confirma-senha">Confirmar Senha</label>
            <input type="password" id="confirma-senha" placeholder="Digite a senha novamente" required>

            <button type="submit">Cadastrar</button>
        </form>
        
        <div class="link-login">
            Já tem uma conta? <a href="index.html">Faça Login</a>
        </div>
    </div>

</body>
</html>
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Acesso</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 320px;
        }
        h2 {
            margin-bottom: 20px;
            color: #333333;
            text-align: center;
        }
        label {
            font-weight: bold;
            color: #555555;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 6px 0 16px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .btn-login {
            width: 100%;
            background-color: #007bff;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        .btn-login:hover { background-color: #0056b3; }

        .btn-cadastro {
            width: 100%;
            background-color: #28a745;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        .btn-cadastro:hover { background-color: #218838; }

        .alternar-tela {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }
        .alternar-tela span {
            color: #007bff;
            cursor: pointer;
            font-weight: bold;
            text-decoration: underline;
        }
        
        /* Classe para esconder a tela que não deve aparecer */
        .escondido {
            display: none;
        }
    </style>
</head>
<body>

    <!-- 🟢 ÁREA DE CADASTRO (Aparece primeiro) -->
    <div id="tela-cadastro" class="container">
        <h2>Criar Nova Conta</h2>
        <form onsubmit="event.preventDefault(); alert('Conta criada com sucesso simulada!');">
            <label for="nome-cad">Nome Completo</label>
            <input type="text" id="nome-cad" placeholder="Digite seu nome" required>

            <label for="email-cad">E-mail</label>
            <input type="email" id="email-cad" placeholder="seu-email@dominio.com" required>

            <label for="senha-cad">Senha</label>
            <input type="password" id="senha-cad" placeholder="Crie uma senha forte" required>

            <button type="submit" class="btn-cadastro">Cadastrar</button>
        </form>
        
        <div class="alternar-tela">
            Já tem uma conta? <span onclick="mostrarLogin()">Faça Login</span>
        </div>
    </div>

    <!-- 🔵 ÁREA DE LOGIN (Fica escondida no começo) -->
    <div id="tela-login" class="container quadrado escondido">
        <h2>Entrar no Sistema</h2>
        <form onsubmit="event.preventDefault(); alert('Login efetuado com sucesso simulado!');">
            <label for="email-log">E-mail</label>
            <input type="email" id="email-log" placeholder="seu-email@dominio.com" required>

            <label for="senha-log">Senha</label>
            <input type="password" id="senha-log" placeholder="Digite sua senha" required>

            <button type="submit" class="btn-login">Acessar</button>
        </form>

        <div class="alternar-tela">
            Não tem uma conta? <span onclick="mostrarCadastro()">Cadastre-se aqui</span>
        </div>
    </div>

    <!-- 🧠 SCRIPT JAVASCRIPT (Controla a mágica da troca de telas) -->
    <script>
        function mostrarLogin() {
            document.getElementById('tela-cadastro').classList.add('escondido');
            document.getElementById('tela-login').classList.remove('escondido');
        }

        function mostrarCadastro() {
            document.getElementById('tela-login').classList.add('escondido');
            document.getElementById('tela-cadastro').classList.remove('escondido');
        }
    </script>

</body>
</html>
